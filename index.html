<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="PNM31 (DON_Kammando)">
<meta name="copyright" content="Copyright PNM31 (DON_Kammando). Original author.">
<title>AI Calculator</title>
<style>
:root{--bg:#f6f7f9;--surface:#ffffff;--text:#14171c;--muted:#5b6370;--accent:#2563eb;--accent-text:#ffffff;--border:#dde1e7;--ok:#15803d;--err:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#181b22;--text:#e8eaef;--muted:#9aa3b2;--accent:#60a5fa;--accent-text:#0b1220;--border:#2a2f3a;--ok:#4ade80;--err:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#181b22;--text:#e8eaef;--muted:#9aa3b2;--accent:#60a5fa;--accent-text:#0b1220;--border:#2a2f3a;--ok:#4ade80;--err:#f87171;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0}
h2{font-size:1rem;margin:0 0 10px}
.sub{color:var(--muted);margin:4px 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
video{width:100%;max-height:60vh;border-radius:10px;background:#000;display:block;margin-bottom:6px;object-fit:cover}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.settings label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px;flex:1 1 120px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.btn{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{min-height:1.4em;margin:10px 0 0;color:var(--muted)}
.status.err{color:var(--err)}
.status.ok{color:var(--ok)}
.big{font-size:2.2rem;font-weight:700;margin:8px 0 4px;font-variant-numeric:tabular-nums;word-break:break-word}
.expr{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all}
.line{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.items{width:100%;border-collapse:collapse;margin:6px 0 10px}
.items td{padding:6px 0;border-bottom:1px solid var(--border)}
.items td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
ol{padding-left:1.3em;margin:8px 0}
.note{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.hist{list-style:none;padding:0;margin:0}
.hist li{margin-bottom:6px}
.hist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border)}
.hist button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hist .expr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist strong{white-space:nowrap;font-variant-numeric:tabular-nums}
.ghost-link{all:unset;cursor:pointer;color:var(--muted);font-size:.9rem;text-decoration:underline}
.credit{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>AI Calculator</h1>
    <p class="sub">Point your camera at a sum, a receipt or a price tag. DailyCal reads it, and the total is checked locally.</p>
  </header>

  <section class="card">
    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="canvas" hidden></canvas>
    <div class="row">
      <button id="camBtn" class="btn">Start camera</button>
      <button id="snap" class="btn primary" disabled>Snap and calculate</button>
      <button id="upload" class="btn" disabled>Upload photo</button>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <div class="row settings">
      <label>Mode
        <select id="mode">
          <option value="auto">Auto</option>
          <option value="math">Maths</option>
          <option value="prices">Prices</option>
        </select>
      </label>
      <label>Currency
        <input id="cur" value="R" maxlength="4">
      </label>
      <label>Tax %
        <input id="tax" type="number" min="0" step="0.1" value="0">
      </label>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">Loading photo reading...</p>
  </section>

  <section class="card">
    <h2>Or type a sum</h2>
    <div class="row">
      <input id="typedIn" placeholder="for example (12.5 + 7) x 3" style="flex:1 1 220px" aria-label="Type a sum">
      <button id="calc" class="btn primary">Calculate</button>
    </div>
  </section>

  <section id="result" class="result" hidden></section>

  <section id="history" class="card" hidden>
    <div class="row" style="justify-content:space-between;margin:0 0 10px">
      <h2 style="margin:0">Recent</h2>
      <button id="clearHist" class="ghost-link">Clear</button>
    </div>
    <ul id="histList" class="hist"></ul>
  </section>
<footer class="credit">Created by PNM31 (DON_Kammando)</footer>
</main>

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  kids.forEach(k => e.append(k));
  return e;
}

    .replace(/,/g, '')
    .replace(/\s+/g, '');
}

  const left = String(s).split('=')[0];
  return normalise(left).replace(/[^0-9.+\-*\/^%()]/g, '');
