<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="PNM31 (DON_Kammando)">
<meta name="copyright" content="Copyright PNM31 (DON_Kammando). Original author.">
<title>AI Calculator</title>
<style>
:root{--bg:#f6f7f9;--surface:#ffffff;--text:#14171c;--muted:#5b6370;--accent:#2563eb;--accent-text:#ffffff;--border:#dde1e7;--ok:#15803d;--err:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#181b22;--text:#e8eaef;--muted:#9aa3b2;--accent:#60a5fa;--accent-text:#0b1220;--border:#2a2f3a;--ok:#4ade80;--err:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#181b22;--text:#e8eaef;--muted:#9aa3b2;--accent:#60a5fa;--accent-text:#0b1220;--border:#2a2f3a;--ok:#4ade80;--err:#f87171;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0}
h2{font-size:1rem;margin:0 0 10px}
.sub{color:var(--muted);margin:4px 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
video{width:100%;max-height:60vh;border-radius:10px;background:#000;display:block;margin-bottom:6px;object-fit:cover}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.settings label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px;flex:1 1 120px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.btn{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{min-height:1.4em;margin:10px 0 0;color:var(--muted)}
.status.err{color:var(--err)}
.status.ok{color:var(--ok)}
.big{font-size:2.2rem;font-weight:700;margin:8px 0 4px;font-variant-numeric:tabular-nums;word-break:break-word}
.expr{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all}
.line{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.items{width:100%;border-collapse:collapse;margin:6px 0 10px}
.items td{padding:6px 0;border-bottom:1px solid var(--border)}
.items td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
ol{padding-left:1.3em;margin:8px 0}
.note{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.hist{list-style:none;padding:0;margin:0}
.hist li{margin-bottom:6px}
.hist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border)}
.hist button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hist .expr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist strong{white-space:nowrap;font-variant-numeric:tabular-nums}
.ghost-link{all:unset;cursor:pointer;color:var(--muted);font-size:.9rem;text-decoration:underline}
.credit{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>AI Calculator</h1>
    <p class="sub">Point your camera at a sum, a receipt or a price tag. DailyCal reads it, and the total is checked locally.</p>
  </header>

  <section class="card">
    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="canvas" hidden></canvas>
    <div class="row">
      <button id="camBtn" class="btn">Start camera</button>
      <button id="snap" class="btn primary" disabled>Snap and calculate</button>
      <button id="upload" class="btn" disabled>Upload photo</button>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <div class="row settings">
      <label>Mode
        <select id="mode">
          <option value="auto">Auto</option>
          <option value="math">Maths</option>
          <option value="prices">Prices</option>
        </select>
      </label>
      <label>Currency
        <input id="cur" value="R" maxlength="4">
      </label>
      <label>Tax %
        <input id="tax" type="number" min="0" step="0.1" value="0">
      </label>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">Loading photo reading...</p>
  </section>

  <section class="card">
    <h2>Or type a sum</h2>
    <div class="row">
      <input id="typedIn" placeholder="for example (12.5 + 7) x 3" style="flex:1 1 220px" aria-label="Type a sum">
      <button id="calc" class="btn primary">Calculate</button>
    </div>
  </section>

  <section id="result" class="result" hidden></section>

  <section id="history" class="card" hidden>
    <div class="row" style="justify-content:space-between;margin:0 0 10px">
      <h2 style="margin:0">Recent</h2>
      <button id="clearHist" class="ghost-link">Clear</button>
    </div>
    <ul id="histList" class="hist"></ul>
  </section>
<footer class="credit">Created by PNM31 (DON_Kammando)</footer>
</main>

<script>
/*
 * AI Calculator
 * Original author: PNM31 (alias: DON_Kammando)
 * Copyright (c) PNM31 (DON_Kammando). All rights reserved.
 */
const $ = id => document.getElementById(id);
let stream = null;
let sampleFn = null;
let history = [];

const HINTS = {
  auto: 'Work out what the photo shows: a maths expression, a receipt or price list, or something else.',
  math: 'Treat the photo as a maths expression or sum. Read every number carefully.',
  prices: 'Treat the photo as a receipt, menu or price list. List each item and its price.'
};

const PROMPT = [
  'You are the reading step of a photo calculator. Look at the image and find any arithmetic, sum or prices.',
  'Reply with ONLY one JSON object. No markdown, no commentary, in this shape:',
  '{"type":"math"|"prices"|"unclear","expression":"","items":[{"name":"","price":0}],"steps":[""],"notes":""}',
  'Rules:',
  '- expression uses only digits, decimal points, + - * / ^ % and parentheses. No currency symbols, no words, no equals sign. Example: (12.5+7)*3',
  '- For receipts, shopping lists or price tags use type "prices". List every item with its numeric price in items, and set expression to the item prices joined by +.',
  '- For a written sum or maths problem use type "math" and write the expression exactly as shown.',
  '- If you cannot read it reliably use type "unclear", leave expression empty, and explain the problem in notes.',
  '- steps: up to 5 short plain-language steps. notes: one short sentence at most.'
].join('\n');

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  kids.forEach(k => e.append(k));
  return e;
}

function setStatus(msg, cls = '') {
  const s = $('status');
  s.textContent = msg;
  s.className = 'status ' + cls;
}

function setBusy(on) {
  $('snap').disabled = on || !stream;
  $('upload').disabled = on || !sampleFn;
}

/* ---------- Safe arithmetic evaluator (no eval) ---------- */
function normalise(s) {
  return String(s)
    .replace(/[×xX]/g, '*')
    .replace(/÷/g, '/')
    .replace(/[−–]/g, '-')
    .replace(/,/g, '')
    .replace(/\s+/g, '');
}

function cleanExpr(s) {
  const left = String(s).split('=')[0];
  return normalise(left).replace(/[^0-9.+\-*\/^%()]/g, '');
}

function tokenize(s) {
  const t = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/[0-9.]/.test(c)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      const n = parseFloat(s.slice(i, j));
      if (isNaN(n)) throw new Error('A number could not be read');
      t.push({ k: 'n', v: n });
      i = j;
    } else if ('+-*/^%()'.includes(c)) {
      t.push({ k: c });
      i++;
    } else {
      throw new Error('Unsupported character: ' + c);
    }
  }
  return t;
}

function evaluate(src) {
  const t = tokenize(normalise(src));
  if (!t.length) throw new Error('Nothing to calculate yet');
  let p = 0;
  const peek = () => (t[p] ? t[p].k : null);
  const eat = k => { if (peek() === k) { p++; return true; } return false; };

  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') {
      const op = t[p++].k;
      const r = term();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  function term() {
    let v = unary();
    while (peek() === '*' || peek() === '/') {
      const op = t[p++].k;
      const r = unary();
      if (op === '/' && r === 0) throw new Error('Cannot divide by zero');
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function unary() {
    if (eat('-')) return -unary();
    if (eat('+')) return unary();
    return power();
  }
  function power() {
    const b = postfix();
    if (eat('^')) return Math.pow(b, unary());
    return b;
  }
  function postfix() {
    let v = factor();
    while (eat('%')) v = v / 100;
    return v;
  }
  function factor() {
    if (peek() === 'n') return t[p++].v;
    if (eat('(')) {
      const v = expr();
      if (!eat(')')) throw new Error('A bracket is missing');
      return v;
    }
    throw new Error('The expression is incomplete');
  }

  const v = expr();
  if (p !== t.length) throw new Error('The expression could not be read to the end');
  if (!isFinite(v)) throw new Error('The result is too large');
  return v;
}

/* ---------- Camera and photo input ---------- */
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    const v = $('video');
    v.srcObject = stream;
    v.hidden = false;
    v.muted = true;
    await new Promise(r => { if (v.readyState >= 1) r(); else v.onloadedmetadata = () => r(); });
    try { await v.play(); } catch (e) { /* the tap that started the camera normally allows playback */ }
    $('camBtn').textContent = 'Stop camera';
    setBusy(false);
    setStatus('Camera ready. Frame the sum or price tags and snap.');
  } catch (e) {
    stream = null;
    setStatus('The camera could not start (' + (e.name || 'error') + '). Use Upload photo instead.', 'err');
    setBusy(false);
  }
}

function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
  $('video').hidden = true;
  $('camBtn').textContent = 'Start camera';
  setBusy(false);
}

function drawToBlob(src, w, h) {
  const max = 1024;
  const s = Math.min(1, max / Math.max(w, h));
  const c = $('canvas');
  c.width = Math.round(w * s);
  c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res, rej) =>
    c.toBlob(b => (b ? res(b) : rej(new Error('Could not prepare the image'))), 'image/jpeg', 0.85)
  );
}

/* ---------- Claude reading ---------- */
function parseReply(text) {
  const t = String(text);
  const a = t.indexOf('{');
  const b = t.lastIndexOf('}');
  if (a < 0 || b < a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
}

function toNum(v) {
  const n = parseFloat(String(v).replace(/,/g, '').replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function friendly(e) {
  if (e && e.code === 'not_granted') return 'Photo reading needs your permission. Allow it and try again, or type the sum instead.';
  if (e && e.code === 'rate_limited') return 'Too many requests. Wait a moment and try again.';
  return (e && e.message) || 'Something went wrong. Please try again.';
}

async function readPhoto(blob) {
  if (!sampleFn) return;
  const mode = $('mode').value;
  setBusy(true);
  setStatus('Reading photo...');
  try {
    const res = await sampleFn(PROMPT + '\n' + HINTS[mode], { images: [blob], modelTier: 'default', cache: false });
    const data = parseReply(res.text);
    if (!data) throw new Error('The reply could not be read. Try a clearer, closer photo.');
    if (data.type === 'unclear') {
      setStatus(data.notes || 'That photo is hard to read. Try again closer and in better light.', 'err');
      return;
    }
    if (data.type === 'prices' && Array.isArray(data.items) && data.items.length) {
      const items = data.items.map(i => ({ name: String(i.name || 'Item').slice(0, 80), price: toNum(i.price) }));
      showResult({ kind: 'prices', expression: items.map(i => i.price).join('+'), items, steps: data.steps, notes: data.notes });
    } else {
      showResult({ kind: 'math', expression: cleanExpr(data.expression || ''), steps: data.steps, notes: data.notes });
    }
    setStatus('Done. Check the result below.', 'ok');
  } catch (e) {
    setStatus(friendly(e), 'err');
  } finally {
    setBusy(false);
  }
}

/* ---------- Result display ---------- */
function fmt(n, money) {
  return Number(n).toLocaleString(undefined, {
    minimumFractionDigits: money ? 2 : 0,
    maximumFractionDigits: money ? 2 : 6
  });
}

function showResult(d) {
  const box = $('result');
  box.hidden = false;
  const money = d.kind === 'prices';
  const cur = $('cur').value;
  const card = el('div', { class: 'card' });
  card.append(el('h2', { text: money ? 'Price total' : 'Result' }));

  let value = null;
  let total = null;
  let err = null;
  try {
    value = evaluate(d.expression);
  } catch (e) {
    err = e.message;
  }

  if (d.items && d.items.length) {
    const table = el('table', { class: 'items' });
    d.items.forEach(i => table.append(el('tr', {}, el('td', { text: i.name }), el('td', { text: cur + fmt(i.price, true) }))));
    card.append(table);
  }

  card.append(el('div', { class: 'expr', text: d.expression || '(nothing read)' }));

  if (err) {
    card.append(el('p', { class: 'status err', text: err }));
  } else if (money) {
    card.append(el('div', { class: 'line' }, el('span', { text: 'Subtotal' }), el('span', { text: cur + fmt(value, true) })));
    const tax = parseFloat($('tax').value) || 0;
    total = value;
    if (tax > 0) {
      const tv = value * tax / 100;
      total = value + tv;
      card.append(el('div', { class: 'line' }, el('span', { text: 'Tax at ' + tax + '%' }), el('span', { text: cur + fmt(tv, true) })));
    }
    card.append(el('div', { class: 'big', text: cur + fmt(total, true) }));
  } else {
    card.append(el('div', { class: 'big', text: fmt(value, false) }));
  }

  if (d.steps && d.steps.length) {
    const ol = el('ol');
    d.steps.slice(0, 6).forEach(s => ol.append(el('li', { text: String(s) })));
    card.append(ol);
  }
  if (d.notes) card.append(el('p', { class: 'note', text: String(d.notes) }));

  const row = el('div', { class: 'row' });
  const inp = el('input', { 'aria-label': 'Expression to recalculate' });
  inp.value = d.expression || '';
  inp.style.flex = '1 1 220px';
  const re = el('button', { class: 'btn', text: 'Recalculate' });
  re.addEventListener('click', () => showResult({ kind: money ? 'prices' : 'typed', expression: cleanExpr(inp.value) }));
  row.append(inp, re);
  card.append(row);

  box.replaceChildren(card);
  if (value !== null) pushHistory(d.expression, cur, money ? total : value, money);
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function pushHistory(expr, cur, val, money) {
  history.unshift({ expr, text: (money ? cur : '') + fmt(val, money) });
  history = history.slice(0, 20);
  renderHistory();
}

function renderHistory() {
  $('history').hidden = !history.length;
  $('histList').replaceChildren(...history.map(h => {
    const b = el('button', { type: 'button' });
    b.append(el('span', { class: 'expr', text: h.expr }), el('strong', { text: '= ' + h.text }));
    b.addEventListener('click', () => showResult({ kind: 'typed', expression: h.expr }));
    return el('li', {}, b);
  }));
}

/* ---------- Wiring ---------- */
$('camBtn').addEventListener('click', () => (stream ? stopCamera() : startCamera()));

$('snap').addEventListener('click', async () => {
  const v = $('video');
  if (!v.videoWidth) return setStatus('The camera is still starting. Try again in a second.', 'err');
  try {
    const blob = await drawToBlob(v, v.videoWidth, v.videoHeight);
    readPhoto(blob);
  } catch (e) {
    setStatus(friendly(e), 'err');
  }
});

$('upload').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f);
    const blob = await drawToBlob(bmp, bmp.width, bmp.height);
    readPhoto(blob);
  } catch (err) {
    setStatus('That file could not be opened as an image.', 'err');
  }
});

$('calc').addEventListener('click', () => {
  const v = $('typedIn').value.trim();
  if (!v) return setStatus('Type a sum first.', 'err');
  showResult({ kind: 'typed', expression: cleanExpr(v) });
});

$('typedIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('calc').click(); });

$('clearHist').addEventListener('click', () => { history = []; renderHistory(); });

(async () => {
  const hasCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  $('camBtn').hidden = !hasCam;
  $('snap').hidden = !hasCam;
  if (!hasCam) setStatus('Live camera is not supported in this view. Use Upload photo.', 'err');
  try {
    sampleFn = window.claude ? await window.claude.use('sample') : null;
  } catch (e) {
    sampleFn = null;
  }
  $('upload').disabled = !sampleFn;
  if (!sampleFn) {
    setStatus('Photo reading is not available in this view. Typed sums still work.', 'err');
  } else if (hasCam) {
    setStatus('Start the camera, or upload a photo.');
  } else {
    setStatus('Upload a photo of a sum, receipt or price tag.');
  }
})();
</script>
</body>
</html>
